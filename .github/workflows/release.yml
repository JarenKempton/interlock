name: Prerelease

on:
  push:
    tags: ["v*-*"]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11
      - run: bun install --frozen-lockfile
      - name: Validate strict SemVer prerelease tag
        env:
          TAG: ${{ github.ref_name }}
        run: bun scripts/release-version.ts "$TAG"
      - run: bun test
      - run: bun run typecheck
      - run: bun run check

  build:
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            target: bun-linux-x64-baseline
            asset: interlock-linux-x64
          - runner: ubuntu-latest
            target: bun-linux-arm64
            asset: interlock-linux-arm64
          - runner: macos-14
            target: bun-darwin-arm64
            asset: interlock-darwin-arm64
          - runner: macos-15-intel
            target: bun-darwin-x64
            asset: interlock-darwin-x64
          - runner: ubuntu-latest
            target: bun-windows-x64-baseline
            asset: interlock-windows-x64.exe
          - runner: ubuntu-latest
            target: bun-windows-arm64
            asset: interlock-windows-arm64.exe
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11
      - run: bun install --frozen-lockfile
      - name: Build versioned standalone executable
        shell: bash
        env:
          VERSION: ${{ github.ref_name }}
          RELEASES_URL: ${{ github.api_url }}/repos/${{ github.repository }}/releases?per_page=20
          TARGET: ${{ matrix.target }}
          ASSET: ${{ matrix.asset }}
        run: |
          set -euo pipefail
          VERSION="${VERSION#v}"
          mkdir -p dist
          bun build src/cli.ts --compile --target="$TARGET" \
            --define "INTERLOCK_BUILD_VERSION=\"$VERSION\"" \
            --define "INTERLOCK_BUILD_RELEASES_URL=\"$RELEASES_URL\"" --outfile="dist/$ASSET"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: dist/${{ matrix.asset }}
          if-no-files-found: error

  smoke:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            asset: interlock-linux-x64
          - runner: macos-14
            asset: interlock-darwin-arm64
          - runner: macos-15-intel
            asset: interlock-darwin-x64
          - runner: windows-latest
            asset: interlock-windows-x64.exe
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: dist
      - name: Native executable smoke test
        shell: bash
        env:
          VERSION: ${{ github.ref_name }}
          ASSET: ${{ matrix.asset }}
        run: |
          set -euo pipefail
          VERSION="${VERSION#v}"
          case "$ASSET" in *.exe) PROGRAM="dist/$ASSET" ;; *) chmod +x "dist/$ASSET"; PROGRAM="./dist/$ASSET" ;; esac
          test "$("$PROGRAM" version)" = "$VERSION"
          "$PROGRAM" runs list
          "$PROGRAM" completions bash | grep -q interlock
          "$PROGRAM" man | grep -q 'INTERLOCK.*1'

  publish:
    needs: smoke
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: .
          merge-multiple: true
      - name: Generate release documentation assets
        run: |
          chmod +x dist/interlock-linux-x64
          dist/interlock-linux-x64 completions bash > dist/interlock.bash
          dist/interlock-linux-x64 completions zsh > dist/_interlock
          dist/interlock-linux-x64 completions fish > dist/interlock.fish
          dist/interlock-linux-x64 man > dist/interlock.1
          cp scripts/install.sh scripts/install.ps1 dist/
      - name: Generate SPDX SBOM
        uses: anchore/sbom-action@v0
        with:
          path: dist
          format: spdx-json
          output-file: dist/interlock.spdx.json
          upload-artifact: false
      - name: Generate checksums
        run: cd dist && sha256sum interlock-* interlock.bash interlock.fish interlock.1 _interlock install.sh install.ps1 interlock.spdx.json > checksums.txt
      - name: Attest release artifacts
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            dist/interlock-*
            dist/interlock.bash
            dist/interlock.fish
            dist/interlock.1
            dist/_interlock
            dist/install.sh
            dist/install.ps1
            dist/interlock.spdx.json
            dist/checksums.txt
      - name: Publish GitHub prerelease
        uses: softprops/action-gh-release@v2
        with:
          prerelease: true
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            dist/interlock-*
            dist/interlock.bash
            dist/interlock.fish
            dist/interlock.1
            dist/_interlock
            dist/install.sh
            dist/install.ps1
            dist/interlock.spdx.json
            dist/checksums.txt
