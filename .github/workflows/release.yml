name: Release

on:
  push:
    tags: ["v*-*"]
  schedule:
    - cron: "23 4 * * *"

permissions:
  contents: read

concurrency:
  group: release-${{ github.event_name == 'schedule' && 'nightly' || github.ref_name }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.release.outputs.build }}
      sha: ${{ steps.release.outputs.sha }}
      tag: ${{ steps.release.outputs.tag }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: voidzero-dev/setup-vp@v1.22.0
        with:
          version: 1.5.0
          run-install: false
      - run: vp install --frozen-lockfile
      - name: Resolve release source
        id: release
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          API_URL: ${{ github.api_url }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          sha=$(git rev-parse HEAD)
          tag="$REF_NAME"
          if [ "$EVENT_NAME" = schedule ]; then
            test "$REF_NAME" = main
            tag=nightly
            response=$(mktemp)
            trap 'rm -f "$response"' EXIT
            status=$(curl --silent --show-error --location --write-out '%{http_code}' \
              "$API_URL/repos/$REPOSITORY/releases/tags/nightly" --output "$response")
            case "$status" in
              200)
                jq -e '.tag_name == "nightly" and .prerelease == true and .draft == false and (.target_commitish | type == "string")' "$response" >/dev/null
                previous=$(jq -r '.target_commitish' "$response")
                if [ "$previous" = "$sha" ] && jq -e --arg marker "<!-- interlock-nightly-sha:$sha -->" '(.body // "") | contains($marker)' "$response" >/dev/null; then
                  echo 'build=false' >> "$GITHUB_OUTPUT"
                  exit 0
                fi
                ;;
              404) ;;
              *) echo "Nightly lookup failed: HTTP $status" >&2; exit 1 ;;
            esac
          fi
          version=$(bun scripts/release-version.ts "$tag" "$sha")
          printf 'build=true\nsha=%s\ntag=%s\nversion=%s\n' "$sha" "$tag" "$version" >> "$GITHUB_OUTPUT"

  verify:
    needs: prepare
    if: needs.prepare.outputs.build == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ needs.prepare.outputs.sha }}
      - uses: voidzero-dev/setup-vp@v1.22.0
        with:
          version: 1.5.0
          run-install: false
      - run: vp install --frozen-lockfile
      - name: Validate release version
        env:
          TAG: ${{ needs.prepare.outputs.tag }}
          SHA: ${{ needs.prepare.outputs.sha }}
        run: vp run release:version "$TAG" "$SHA"
      - run: vp run test
      - run: vp run typecheck
      - run: vp run check

  build:
    needs: [prepare, verify]
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            target: bun-linux-x64-baseline
            asset: interlock-linux-x64
          - runner: ubuntu-latest
            target: bun-linux-arm64
            asset: interlock-linux-arm64
          - runner: macos-15
            target: bun-darwin-arm64
            asset: interlock-darwin-arm64
          - runner: macos-15-intel
            target: bun-darwin-x64
            asset: interlock-darwin-x64
          - runner: ubuntu-latest
            target: bun-windows-x64-baseline
            asset: interlock-windows-x64.exe
          - runner: ubuntu-latest
            target: bun-windows-arm64
            asset: interlock-windows-arm64.exe
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ needs.prepare.outputs.sha }}
      - uses: voidzero-dev/setup-vp@v1.22.0
        with:
          version: 1.5.0
          run-install: false
      - run: vp install --frozen-lockfile
      - name: Build versioned standalone executable
        shell: bash
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          RELEASES_URL: ${{ github.api_url }}/repos/${{ github.repository }}/releases?per_page=20
          TARGET: ${{ matrix.target }}
          ASSET: ${{ matrix.asset }}
        run: |
          set -euo pipefail
          mkdir -p dist
          vp run build:release --target="$TARGET" \
            --define "INTERLOCK_BUILD_VERSION=\"$VERSION\"" \
            --define "INTERLOCK_BUILD_RELEASES_URL=\"$RELEASES_URL\"" --outfile="dist/$ASSET"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: dist/${{ matrix.asset }}
          if-no-files-found: error

  smoke:
    needs: [prepare, build]
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            asset: interlock-linux-x64
          - runner: macos-15
            asset: interlock-darwin-arm64
          - runner: macos-15-intel
            asset: interlock-darwin-x64
          - runner: windows-latest
            asset: interlock-windows-x64.exe
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: dist
      - name: Native executable smoke test
        shell: bash
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          ASSET: ${{ matrix.asset }}
        run: |
          set -euo pipefail
          case "$ASSET" in *.exe) PROGRAM="dist/$ASSET" ;; *) chmod +x "dist/$ASSET"; PROGRAM="./dist/$ASSET" ;; esac
          test "$("$PROGRAM" --version)" = "$VERSION"
          "$PROGRAM" runs list
          "$PROGRAM" completions bash | grep -q interlock
          "$PROGRAM" man | grep -q 'INTERLOCK.*1'

  publish:
    needs: [prepare, smoke]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.sha }}
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Generate release documentation assets
        run: |
          chmod +x dist/interlock-linux-x64
          dist/interlock-linux-x64 completions bash > dist/interlock.bash
          dist/interlock-linux-x64 completions zsh > dist/_interlock
          dist/interlock-linux-x64 completions fish > dist/interlock.fish
          dist/interlock-linux-x64 man > dist/interlock.1
          cp scripts/install.sh scripts/install.ps1 dist/
      - name: Generate SPDX SBOM
        uses: anchore/sbom-action@v0
        with:
          path: dist
          format: spdx-json
          output-file: dist/interlock.spdx.json
          upload-artifact: false
      - name: Generate checksums
        run: cd dist && sha256sum interlock-* interlock.bash interlock.fish interlock.1 _interlock install.sh install.ps1 interlock.spdx.json > checksums.txt
      - name: Attest release artifacts
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            dist/interlock-*
            dist/interlock.bash
            dist/interlock.fish
            dist/interlock.1
            dist/_interlock
            dist/install.sh
            dist/install.ps1
            dist/interlock.spdx.json
            dist/checksums.txt
      - name: Advance existing nightly tag
        if: needs.prepare.outputs.tag == 'nightly'
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ needs.prepare.outputs.sha }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          refs=$(gh api "repos/$REPOSITORY/git/matching-refs/tags/nightly")
          if printf '%s' "$refs" | jq -e 'any(.[]; .ref == "refs/tags/nightly")' >/dev/null; then
            gh api --method PATCH "repos/$REPOSITORY/git/refs/tags/nightly" -f sha="$SHA" -F force=false
          fi
      - name: Publish GitHub prerelease
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          target_commitish: ${{ needs.prepare.outputs.sha }}
          name: ${{ needs.prepare.outputs.version }}
          prerelease: true
          make_latest: false
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            dist/interlock-*
            dist/interlock.bash
            dist/interlock.fish
            dist/interlock.1
            dist/_interlock
            dist/install.sh
            dist/install.ps1
            dist/interlock.spdx.json
            dist/checksums.txt
      - name: Record completed nightly publication
        if: needs.prepare.outputs.tag == 'nightly'
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ needs.prepare.outputs.sha }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          release=$(gh api "repos/$REPOSITORY/releases/tags/nightly")
          id=$(printf '%s' "$release" | jq -er '.id')
          printf '%s' "$release" | jq --arg sha "$SHA" \
            '{body: (((.body // "") | gsub("<!-- interlock-nightly-sha:[0-9a-f]{40} -->"; "")) + "\n<!-- interlock-nightly-sha:" + $sha + " -->")}' \
            | gh api --method PATCH "repos/$REPOSITORY/releases/$id" --input -
