name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11
      - run: bun install --frozen-lockfile
      - if: runner.os != 'Linux'
        run: bun test
        env:
          INTERLOCK_TEST_OS_CREDENTIAL_STORE: "1"
      - if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y gnome-keyring libsecret-1-0 dbus-daemon
          dbus-run-session -- bash -c 'echo -n ci | gnome-keyring-daemon --unlock --components=secrets >/dev/null && bun test'
        env:
          INTERLOCK_TEST_OS_CREDENTIAL_STORE: "1"
      - run: bun run typecheck
      - run: bun run check
      - run: bun run db:check
      - name: Fail on unversioned breaking contract changes
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          git fetch --no-tags --depth=1 origin "+refs/heads/$BASE_REF:refs/remotes/origin/$BASE_REF"
          bun run contracts:check "origin/$BASE_REF"
      - run: bun run db:generate
      - name: Fail if schema and migrations disagree
        shell: bash
        run: git diff --exit-code
      - run: bun run build
      - name: Compiled binary migrates fresh and existing ledgers
        shell: bash
        run: |
          set -euo pipefail
          smoke="$(mktemp -d)"
          export XDG_STATE_HOME="$smoke/state"
          export HOME="$smoke/home"
          export LOCALAPPDATA="$smoke/AppData"
          mkdir -p "$HOME"
          if [ -f dist/interlock.exe ]; then bin="dist/interlock.exe"; else bin="./dist/interlock"; fi
          "$bin" runs list
          case "$(uname -s)" in
            Darwin) ledger="$HOME/Library/Application Support/interlock-dev/interlock.db" ;;
            MINGW*|MSYS*|CYGWIN*) ledger="$LOCALAPPDATA/Interlock-dev/interlock.db" ;;
            *) ledger="$XDG_STATE_HOME/interlock-dev/interlock.db" ;;
          esac
          test -f "$ledger"
          cp test/fixtures/ledgers/v1.db "$ledger"
          "$bin" runs list | grep -q "interlock-run:sample-v1"
          "$bin" runs list | grep -q "interlock-run:sample-v1"

  site:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11
      - run: bun install --frozen-lockfile
      - run: bun run check:deploy
