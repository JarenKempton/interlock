name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  INTERLOCK_LINT_BASE: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || 'HEAD^' }}

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: voidzero-dev/setup-vp@v1.22.0
        with:
          version: 1.5.0
          run-install: false
      - run: vp install --frozen-lockfile
      - if: runner.os != 'Linux'
        run: vp run test
        env:
          INTERLOCK_TEST_OS_CREDENTIAL_STORE: "1"
      - if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y gnome-keyring libsecret-1-0 dbus-daemon
          dbus-run-session -- bash -c 'echo -n ci | gnome-keyring-daemon --unlock --components=secrets >/dev/null && vp run test'
        env:
          INTERLOCK_TEST_OS_CREDENTIAL_STORE: "1"
      - run: vp run typecheck
      - run: vp run check
      - run: vp run db:check
      - run: vp run db:generate
      - name: Fail if schema and migrations disagree
        shell: bash
        run: git diff --exit-code
      - run: vp run build
      - name: Compiled binary migrates fresh and existing ledgers
        shell: bash
        run: |
          set -euo pipefail
          smoke="$(mktemp -d)"
          export XDG_STATE_HOME="$smoke/state"
          export HOME="$smoke/home"
          export LOCALAPPDATA="$smoke/AppData"
          mkdir -p "$HOME"
          if [ -f dist/interlock.exe ]; then bin="dist/interlock.exe"; else bin="./dist/interlock"; fi
          "$bin" runs list
          case "$(uname -s)" in
            Darwin) ledger="$HOME/Library/Application Support/interlock-dev/interlock.db" ;;
            MINGW*|MSYS*|CYGWIN*) ledger="$LOCALAPPDATA/Interlock-dev/interlock.db" ;;
            *) ledger="$XDG_STATE_HOME/interlock-dev/interlock.db" ;;
          esac
          test -f "$ledger"
          cp test/fixtures/ledgers/v1.db "$ledger"
          "$bin" runs list | grep -q "interlock-run:sample-v1"
          "$bin" runs list | grep -q "interlock-run:sample-v1"

  windows-shards:
    name: Windows shard ${{ matrix.shard }}/4
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: voidzero-dev/setup-vp@v1.22.0
        with:
          version: 1.5.0
          run-install: false
      - run: vp install --frozen-lockfile
      - run: vp run test:shard ${{ matrix.shard }} 4
        env:
          INTERLOCK_TEST_OS_CREDENTIAL_STORE: "1"
      - if: matrix.shard == 1
        run: vp run typecheck
      - if: matrix.shard == 1
        run: vp run check
      - if: matrix.shard == 1
        run: vp run db:check
      - if: matrix.shard == 1
        run: vp run db:generate
      - name: Fail if schema and migrations disagree
        if: matrix.shard == 1
        shell: bash
        run: git diff --exit-code
      - if: matrix.shard == 1
        run: vp run build
      - name: Compiled binary migrates fresh and existing ledgers
        if: matrix.shard == 1
        shell: bash
        run: |
          set -euo pipefail
          smoke="$(mktemp -d)"
          export HOME="$smoke/home"
          export LOCALAPPDATA="$smoke/AppData"
          mkdir -p "$HOME"
          dist/interlock.exe runs list
          ledger="$LOCALAPPDATA/Interlock-dev/interlock.db"
          test -f "$ledger"
          cp test/fixtures/ledgers/v1.db "$ledger"
          dist/interlock.exe runs list | grep -q "interlock-run:sample-v1"
          dist/interlock.exe runs list | grep -q "interlock-run:sample-v1"

  test-windows:
    name: test (windows-latest)
    if: always()
    needs: windows-shards
    runs-on: ubuntu-latest
    steps:
      - name: Require every Windows shard to pass
        env:
          SHARD_RESULT: ${{ needs.windows-shards.result }}
        run: test "$SHARD_RESULT" = success

  site:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: voidzero-dev/setup-vp@v1.22.0
        with:
          version: 1.5.0
      - run: vp install --frozen-lockfile
      - run: vp run check:deploy
