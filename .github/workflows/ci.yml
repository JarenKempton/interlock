name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11
      - run: bun install --frozen-lockfile
      - if: runner.os != 'Linux'
        run: bun test
        env:
          INTERLOCK_TEST_OS_CREDENTIAL_STORE: "1"
      - if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y gnome-keyring libsecret-1-0 dbus-daemon
          dbus-run-session -- bash -c 'echo -n ci | gnome-keyring-daemon --unlock --components=secrets >/dev/null && bun test'
        env:
          INTERLOCK_TEST_OS_CREDENTIAL_STORE: "1"
      - run: bun run typecheck
      - run: bun run check
      - run: bun run build
